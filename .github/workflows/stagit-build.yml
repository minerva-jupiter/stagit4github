name: Build Stagit Portal

on:
  schedule:
    - cron: '36 */3 * * *'
  repository_dispatch:
    types: [repo_pushed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:

      - name: Install dependencies & stagit
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev gcc make
          git clone git://git.2f30.org/stagit /tmp/stagit
          cd /tmp/stagit
          make -j$(nproc)
          sudo make install


      - name: Clone All Repositories & Build Static Files
        env:
          GH_TOKEN: ${{ secrets.PORTAL_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          
          mkdir -p repositories html
          ROOT_DIR="$(pwd)"

          gh repo list --limit 1000 --json url -q '.[].url' | while read -r url; do
            [ -z "$url" ] && continue
            repo_name=$(basename "$url" .git)
            
            git clone --bare "$url" "repositories/${repo_name}.git"
            
            mkdir -p "html/${repo_name}"
            cd "repositories/${repo_name}.git"
            stagit "${ROOT_DIR}/html/${repo_name}"
            cd "${ROOT_DIR}"
          done

          cd repositories
          stagit-index *.git > "${ROOT_DIR}/html/index.html"
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html        
