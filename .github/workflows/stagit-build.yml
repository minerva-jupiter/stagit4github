name: Build Stagit Portal

on:
  schedule:
    - cron: '36 */3 * * *'
  repository_dispatch:
    types: [repo_pushed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Install stagit
        run: |
          sudo apt-get update
          sudo apt-get install -y stagit git

      - name: Fetch repository list and generate HTML
        env:
          GH_TOKEN: ${{ secrets.PORTAL_PAT }} # PAT(Personal Access Token)
        run: |
          mkdir repos site
          cd repos

          # API経由でアカウント内の全パブリック/プライベートリポジトリのclone URLを取得
          gh repo list --limit 1000 --json name,cloneUrl,description,isPrivate -q '.[]' > repos_info.json

          # 各リポジトリを bare clone して stagit を個別ビルド
          cat repos_info.json | jq -r '.cloneUrl' | while read -r url; do
            repo_name=$(basename "$url" .git)
            git clone --bare "$url" "${repo_name}.git"
            
            mkdir -p "../site/${repo_name}"
            cd "${repo_name}.git"
            stagit "../site/${repo_name}"
            cd ..
          done

          # ルート目録用（stagit-index）の生成
          stagit-index *.git > ../site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
