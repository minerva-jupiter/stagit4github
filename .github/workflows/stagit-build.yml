name: Build Stagit Portal

on:
  schedule:
    - cron: '36 */3 * * *'
  repository_dispatch:
    types: [repo_pushed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:

      - name: Clone All Repositories
        env:
          GH_TOKEN: ${{ secrets.PORTAL_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          
          mkdir -p repositories html

          # url フィールドを使用する
          gh repo list --limit 1000 --json url -q '.[].url' | while read -r url; do
            [ -z "$url" ] && continue
            repo_name=$(basename "$url" .git)
            git clone --bare "$url" "repositories/${repo_name}.git"
          done      - name: Generate HTML with Stagit Container
        run: |
          docker run --rm \
            -v "$PWD/html:/html" \
            -v "$PWD/repositories:/repositories" \
            servercontainers/stagit

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html        
