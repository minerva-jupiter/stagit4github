name: Build Stagit Portal

on:
  schedule:
    - cron: '36 */3 * * *'
  repository_dispatch:
    types: [repo_pushed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:

      - name: Install dependencies & stagit
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev gcc make
          git clone https://github.com/oxalorg/stagit.git /tmp/stagit
          cd /tmp/stagit
          make -j$(nproc)
          sudo make install


      - name: Clone All Repositories & Build Static Files
        env:
           GH_TOKEN: ${{ secrets.PORTAL_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          
          mkdir -p repositories html
          ROOT_DIR = "$(pwd)"
          gh repo list --limit 1000 --json url -q '.[].url' | while read -r url; do
            [ -z "$url" ] && continue
            repo_name=$(basename "$url" .git)
            
            repo_path="${ROOT_DIR}/repositories/${repo_name}.git"
            site_path="${ROOT_DIR}/html/${repo_name}"
            
            git clone --bare "$url" "$repo_path"
            
            mkdir -p "$site_path"
            
            # リポジトリディレクトリの中で stagit を実行し、出力先を絶対パスで指定
            cd "$repo_path"
            stagit "$site_path"
            cd "$ROOT_DIR"
          done

          # ルート目録（index.html）の生成
          cd "${ROOT_DIR}/repositories"
          stagit-index *.git > "${ROOT_DIR}/html/index.html"
          cd "$ROOT_DIR"
                  
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html        
