name: Build Stagit Portal

on:
  schedule:
    - cron: '36 */3 * * *'
  repository_dispatch:
    types: [repo_pushed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Install dependencies & stagit
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev gcc make
          git clone https://github.com/oxalorg/stagit.git /tmp/stagit
          cd /tmp/stagit
          sed -i 's/#define maxfilesize .*/#define maxfilesize (1024 * 1024 * 2)/g' stagit.c || true
          make -j$(nproc)
          sudo make install

      - name: Clone All Repositories
        env:
          GH_TOKEN: ${{ secrets.PORTAL_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          
          mkdir -p repositories

          gh repo list --limit 1000 --json url -q '.[].url' | while read -r url; do
            [ -z "$url" ] && continue
            repo_name=$(basename "$url" .git)
            git clone --bare "$url" "repositories/${repo_name}.git"
          done

      - name: Generate Stagit HTML
        run: |
          mkdir -p html
          ROOT_DIR="$(pwd)"

          for repo_dir in "${ROOT_DIR}/repositories"/*.git; do
            [ -d "$repo_dir" ] || continue
            
            repo_name=$(basename "$repo_dir" .git)
            site_dir="${ROOT_DIR}/html/${repo_name}"
            
            mkdir -p "$site_dir"
            
            (cd "$site_dir" && stagit "$repo_dir")
          done

          (cd "${ROOT_DIR}/repositories" && stagit-index *.git > "${ROOT_DIR}/html/index.html")

      - name: Purge oversized HTML files for Cloudflare Pages
        run: |
          echo "Checking for files larger than 20MB..."
          
          # 20MBを超えるHTMLファイルを検出して置換
          find html -type f -size +20M -name "*.html" | while read -r file; do
            filesize=$(du -h "$file" | cut -f1)
            echo "PURGING: $file ($filesize) exceeds Cloudflare Pages limits."
            
            cat << 'EOF' > "$file"
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>File Truncated</title>
            <style>
              body { font-family: sans-serif; margin: 2em; background: #fdf6e3; color: #657b83; }
              .box { border: 2px solid #dc322f; padding: 1.5em; border-radius: 4px; background: #fff; }
              h1 { color: #dc322f; margin-top: 0; }
            </style>
          </head>
          <body>
            <div class="box">
              <h1>⚠️ Diff/File Exceeds Size Limit</h1>
              <p>This page was omitted from the static build because its generated size exceeds Cloudflare Pages' 25MB single-file limit.</p>
              <p>Please inspect this commit or file locally in your git clone.</p>
            </div>
          </body>
          </html>
          EOF
          done

      - name: Push ./html to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.PORTAL_PAT }}
        run: |
          cd html
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git commit -m "deploy: update stagit portal site"
          
          # PORTAL_PAT を使って gh-pages ブランチに強制プッシュ
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages
